<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Trippples POC</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main>

        <h1>Trippples</h1>

        
        <nav id="gameMenu" aria-label="Game menu">
            <button id="newGameButton" type="button">New Game</button>
            <button id="undoButton" type="button">Undo</button>
        </nav>
        
        <div id="gameLayout">
            <div id="boardArea">
                <canvas
                    id="gameCanvas"
                    aria-label="Trippples game board"
                ></canvas>
            </div>

            <aside id="gameInfo" aria-label="Player progress">
                <section class="playerInfo">
                    <h2>Spieler A – Blau</h2>
                    <svg
                        id="blueMiniMap"
                        class="miniMap"
                        viewBox="0 0 150 150"
                        role="img"
                        aria-label="Parcoursfortschritt von Spieler A"
                    ></svg>
                </section>

                <section class="playerInfo">
                    <h2>Spieler B – Orange</h2>
                    <svg
                        id="orangeMiniMap"
                        class="miniMap"
                        viewBox="0 0 150 150"
                        role="img"
                        aria-label="Parcoursfortschritt von Spieler B"
                    ></svg>
                </section>
            </aside>
        </div>

        <div id="gameStatus" role="status" aria-live="polite"></div>

    </main>

    <script src="js/board.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
