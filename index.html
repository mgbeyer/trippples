<!doctype html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Trippples POC</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main>

        <h1>Trippples</h1>

        <section id="newGameSettings" aria-label="Spielsteuerung">
            <div class="setting">
                <label for="startingPlayer">Startspieler</label>
                <select id="startingPlayer">
                    <option value="alternate" selected>Abwechselnd</option>
                    <option value="blue">Spieler A – Blau</option>
                    <option value="orange">Spieler B – Orange</option>
                </select>
            </div>

            <div class="setting">
                <label for="boardChoice">Spielbrett</label>
                <select id="boardChoice">
                    <option value="random" selected>Neues Zufallsbrett</option>
                    <option value="reuse">Aktuelles Brett beibehalten</option>
                </select>
            </div>

            <div class="gameActions">
                <button id="newGameButton" type="button">
                    Neues Spiel
                </button>
                <button id="undoButton" type="button">
                    Zug zurücknehmen
                </button>
            </div>
        </section>
        
        <div id="gameLayout">
            <div id="boardArea">
                <canvas
                    id="gameCanvas"
                    aria-label="Trippples game board"
                ></canvas>
            </div>

            <aside id="gameInfo" aria-label="Player progress">
                <section class="playerInfo">
                    <h2>Spieler A – Blau</h2>
                    <svg
                        id="blueMiniMap"
                        class="miniMap"
                        viewBox="0 0 150 150"
                        role="img"
                        aria-label="Parcoursfortschritt von Spieler A"
                    ></svg>
                </section>

                <section class="playerInfo">
                    <h2>Spieler B – Orange</h2>
                    <svg
                        id="orangeMiniMap"
                        class="miniMap"
                        viewBox="0 0 150 150"
                        role="img"
                        aria-label="Parcoursfortschritt von Spieler B"
                    ></svg>
                </section>
            </aside>
        </div>

        <div id="gameStatus" role="status" aria-live="polite"></div>

    </main>

    <script src="js/board.js"></script>
    <script src="js/rules.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
